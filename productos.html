<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="cubo/Logo/logo-only.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <title>Productos</title>
</head>
<body>
    <!-- Preloader overlay: muestra la animación antes de cargar el contenido -->
    <div id="preloader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:9999;">
        <img id="preloader-img" src="cubo/3D/5.png" alt="Animación" width="300">
    </div>
    <!-- Contenido principal oculto hasta que termine la animación -->
    <div id="content" style="visibility:hidden;">
        <nav>
            <ul class="nav-left">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
            </ul>
            <ul class="nav-right">

                <li id="loginLink">
                    <a href="login.html">Login</a>
                </li>

                <li id="signupLink">
                    <a href="signup.html">Sign Up</a>
                </li>

                <li id="usuarioMenu" class="usuario-menu">
                    <button id="botonUsuario"></button>

                    <div id="menuDesplegable" class="menu-desplegable">
                        <button id="cerrarSesion">Cerrar sesión</button>
                    </div>
                </li>

                <li>
                    <a href="carrito.html">
                        <img src="cubo\Carrito\Carrito_Empty.png" width="30px">
                    </a>
                </li>

            </ul>
        </nav>
        <br><br><br>
        <div class="main-title2">
            <h1 style="color: #333333;">Existe un Cuberty para <span>TODOS</span></h1>
        </div>



        <div class="grid-productos">
            <div class="producto">
                <div class="imgproducto">
                    <img class="imgmain" src="cubo/Fotos/SL1.jpg" alt="Cubo Stickerless">
                    <img class="imghover" src="cubo/Fotos/SL2.jpg" alt="Cubo Stickerless">
                </div>
                
                <div class="infoproducto">
                    <h3>Cubo 3x3 Stickerless</h3>
                    <p>El cubo de Rubik 3x3 sin stickers para un uso profesional</p>
                </div>
                <div class="precio-producto">
                    <button class="botonCompras" data-id="cubo-3x3-stickerless" data-nombre="Cubo 3x3 Stickerless" data-precio="5800" data-imagen="cubo/Fotos/SL1.jpg" data-descripcion="El cubo de Rubik 3x3 sin stickers para un uso profesional"> $5800</button>
                </div>
            </div>
            <div class="producto">
                <div class="imgproducto">
                    <img class="imgmain" src="cubo/Fotos/B1.jpg" alt="Cubo Negro">
                    <img class="imghover" src="cubo/Fotos/B2.jpg" alt="Cubo Negro">
                </div>
                
                <div class="infoproducto">
                    <h3>Cubo 3x3 Negro</h3>
                    <p>El cubo clásico de Rubik 3x3 para un uso casual</p>
                </div>
                <div class="precio-producto">
                    <button class="botonCompras" data-id="cubo-3x3-negro" data-nombre="Cubo 3x3 Negro" data-precio="5800" data-imagen="cubo/Fotos/B1.jpg" data-descripcion="El cubo clásico de Rubik 3x3 para un uso casual"> $5800</button>
                </div>
            </div>
            
            
        </div>

    </div>

    

    <footer> 
        <div class="fondotrucho">
            <section class="suscripcion">
            <h2>
                UNITE A LA<span> COMUNIDAD CUBERTY</span>
            </h2>
            <form class="formulario">
                <input type="email" placeholder="Email address" Required>
                <button type="submit">UNETE</button>
            </form>

            </section>
        </div>
        <p>© Todos los derechos reservados a Cuberty</p>
    </footer>

    <script src="animacionimagen.js"></script>
    <script src="compra.js"></script>
    <script>
        const usuarioGuardado = localStorage.getItem("usuario");

        const loginLink = document.getElementById("loginLink");
        const signupLink = document.getElementById("signupLink");

        const usuarioMenu = document.getElementById("usuarioMenu");
        const botonUsuario = document.getElementById("botonUsuario");

        const menuDesplegable = document.getElementById("menuDesplegable");
        const cerrarSesion = document.getElementById("cerrarSesion");


        // Si hay un usuario logueado
        if (usuarioGuardado) {

            // Ocultar Login y Sign Up
            loginLink.style.display = "none";
            signupLink.style.display = "none";

            // Mostrar usuario
            usuarioMenu.style.display = "block";
            botonUsuario.textContent = usuarioGuardado + " ▼";

        } else {

            // Si no hay sesión, ocultar el menú de usuario
            usuarioMenu.style.display = "none";
        }


        // Abrir/cerrar menú
        botonUsuario.addEventListener("click", function() {
            menuDesplegable.classList.toggle("mostrar");
        });


        // Cerrar sesión
        cerrarSesion.addEventListener("click", function() {

            localStorage.removeItem("usuario");
            localStorage.removeItem("contraseña");

            window.location.href = "index.html";
        });
    </script>
</body>
</html>
